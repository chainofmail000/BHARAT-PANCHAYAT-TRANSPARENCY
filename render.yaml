services:
  - type: web
    name: nagrik-kothamangalam-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: https://nagrik-kothamangalam.vercel.app,http://localhost:3000,http://127.0.0.1:3000
      - key: DATABASE_URL
        value: sqlite:///./database.db
  - type: web
    name: nagrik-kothamangalam-web
    runtime: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    rootDir: .
    envVars:
      - key: REACT_APP_API_BASE_URL
        value: https://nagrik-kothamangalam-api.onrender.com
